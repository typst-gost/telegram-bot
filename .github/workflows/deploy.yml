name: Build and Deploy to VDS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sync_docs:
        description: "Принудительно обновить docs_vector_db и compile_assets на VDS"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.prep.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare lowercase image reference
        id: prep
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_ref=${IMAGE_LOWER}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Если VDS на ARM64, поменяйте на linux/arm64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VDS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout compose files
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload compose files and deploy
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_PORT: ${{ secrets.VDS_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.VDS_DEPLOY_PATH || '/opt/typst-gost-bot' }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          SYNC_DOCS: ${{ inputs.sync_docs || false }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${VDS_PORT} -o StrictHostKeyChecking=accept-new"

          ssh ${SSH_OPTS} "${VDS_USER}@${VDS_HOST}" \
            "mkdir -p '${DEPLOY_DIR}/fonts'"

          scp -i ~/.ssh/deploy_key -P "${VDS_PORT}" -o StrictHostKeyChecking=accept-new \
            docker-compose.yml .env.example \
            "${VDS_USER}@${VDS_HOST}:${DEPLOY_DIR}/"

          echo "${{ secrets.GITHUB_TOKEN }}" | ssh ${SSH_OPTS} "${VDS_USER}@${VDS_HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh ${SSH_OPTS} "${VDS_USER}@${VDS_HOST}" bash -s <<EOF
            set -euo pipefail
            cd "${DEPLOY_DIR}"

            if [ ! -f .env ]; then
              echo "ERROR: ${DEPLOY_DIR}/.env не найден! Создайте его из .env.example и перезапустите деплой." >&2
              exit 1
            fi

            cat > docker-compose.override.yml <<OVERRIDE
          services:
            bot:
              image: ${IMAGE_REF}
          OVERRIDE

            docker compose pull
            docker compose up -d --remove-orphans

            if [ "${SYNC_DOCS}" = "true" ]; then
              echo "Running sync-docs-db and restarting bot to reload LanceDB table..."
              docker compose exec -T bot sync-docs-db
              docker compose restart bot
            fi

            # Ждём healthy-статуса контейнера
            for i in \$(seq 1 24); do
              status=\$(docker inspect --format '{{.State.Health.Status}}' typst-gost-bot 2>/dev/null || echo "starting")
              echo "Health status (\$i/24): \$status"
              if [ "\$status" = "healthy" ]; then
                break
              fi
              if [ "\$status" = "unhealthy" ] || [ "\$i" -eq 24 ]; then
                docker compose logs --tail=50 bot
                exit 1
              fi
              sleep 5
            done

            docker image prune -f
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key