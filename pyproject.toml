[project]
name = "typst-gost-bot"
version = "0.1.0"
description = "Telegram RAG bot for Typst and modern-g7-32 (GOST 7.32-2017)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.32.0",
    "aiohttp-socks>=0.12.0",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.0",
    "telegramify-markdown>=1.4.0",
]

[project.scripts]
typst-gost-bot = "typst_gost_bot.main:run"
sync-assets = "typst_gost_bot.scripts.sync_assets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typst_gost_bot"]

[tool.ruff]
line-length = 99
target-version = "py312"